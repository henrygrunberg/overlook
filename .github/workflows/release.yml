name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check the tag matches the version
        run: |
          for file in package.json public/manifest.json; do
            version="v$(node -p "require('./$file').version")"
            if [ "$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error file=$file::Version $version does not match tag $GITHUB_REF_NAME"
              exit 1
            fi
          done
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm audit signatures
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: ./.github/actions/package-extension
        with:
          zip: overlook-${{ github.ref_name }}.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            overlook-${{ github.ref_name }}.zip
            overlook-${{ github.ref_name }}.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            "overlook-$GITHUB_REF_NAME.zip" "overlook-$GITHUB_REF_NAME.zip.sha256"
